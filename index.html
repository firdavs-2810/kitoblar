<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitoblar Portali</title>
    <style>
        :root {
            /* Sokin tungi orqa fon */
            --bg-main: #0B101E;
            --text-color: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.7);
            
            /* Glassmorphism o'zgaruvchilar */
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-hover-border: rgba(72, 198, 239, 0.6); /* Psixologik qulay yumshoq havorang */
            --glass-hover-shadow: rgba(72, 198, 239, 0.25);
            --glass-shadow: rgba(0, 0, 0, 0.4);
            --card-inner: rgba(11, 16, 30, 0.6);
            
            /* Liquid Blobs ranglari (Dark) */
            --blob-1: #2E5B99;
            --blob-2: #6B4984;
            
            /* Tugmalar */
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-text: #ffffff;
            --btn-action: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --btn-hover-action: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); /* Yalpiz/Yashil - xotirjamlik va muvaffaqiyat */
        }

        body.light-mode {
            /* Sokin kunduzgi orqa fon */
            --bg-main: #F4F7F6;
            --text-color: #2c3e50;
            --text-sub: rgba(44, 62, 80, 0.7);
            
            /* Glassmorphism o'zgaruvchilar */
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 1);
            --glass-hover-border: rgba(111, 134, 214, 0.8);
            --glass-hover-shadow: rgba(111, 134, 214, 0.3);
            --glass-shadow: rgba(144, 164, 174, 0.2);
            --card-inner: rgba(255, 255, 255, 0.7);
            
            /* Liquid Blobs ranglari (Light) */
            --blob-1: #a1c4fd;
            --blob-2: #c2e9fb;

            /* Tugmalar */
            --btn-bg: rgba(255, 255, 255, 0.8);
            --btn-text: #ffffff;
            --btn-action: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --btn-hover-action: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease, transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-color);
            min-height: 100vh;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* LIQUID GLASS ORQA FON ELEMENTLARI */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: -1;
            opacity: 0.6;
            animation: float 15s ease-in-out infinite alternate;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: var(--blob-1);
            top: 5%;
            left: -5%;
        }

        .blob-2 {
            width: 500px;
            height: 500px;
            background: var(--blob-2);
            bottom: -10%;
            right: -5%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -50px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .top-controls {
            position: absolute;
            top: 25px;
            right: 25px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        /* Glass tugmalar */
        .btn-glass {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 12px 22px;
            border-radius: 30px;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 4px 15px var(--glass-shadow);
        }

        .btn-glass:hover {
            transform: scale(1.08) translateY(-2px);
            background: var(--glass-hover-border);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 10px 25px var(--glass-hover-shadow);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 40px;
            margin-top: 10px;
            text-shadow: 0 10px 30px rgba(0,0,0,0.3);
            letter-spacing: 1px;
            font-weight: 700;
            text-align: center;
        }

        /* Admin Paneli Glassmorphism */
        .admin-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 50px;
            display: none;
            box-shadow: 0 15px 35px var(--glass-shadow);
        }

        .admin-panel.active { display: block; }
        .admin-panel h3 { margin-bottom: 20px; font-weight: 600; }

        .form-group { display: flex; flex-direction: column; gap: 16px; }
        .file-input-group { display: flex; gap: 12px; align-items: center; }
        .file-input-group input[type="url"] { flex: 1; }

        .file-select-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 14px 20px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
        }

        .file-select-btn:hover {
            background: var(--glass-hover-border);
            color: #fff;
            transform: scale(1.05);
        }

        #uploadStatus {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-top: -5px;
            font-weight: 500;
        }

        input[type="text"], input[type="url"], input[type="password"] {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 14px 18px;
            border-radius: 14px;
            color: var(--text-color);
            outline: none;
            font-size: 1rem;
            backdrop-filter: blur(10px);
        }
        
        input[type="text"]:focus, input[type="url"]:focus, input[type="password"]:focus {
            border-color: var(--glass-hover-border);
            box-shadow: 0 0 15px var(--glass-hover-shadow);
        }

        input::placeholder { color: var(--text-sub); }

        .btn-submit {
            background: var(--btn-action);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        .btn-submit:hover {
            transform: scale(1.04) translateY(-3px);
            background: var(--btn-hover-action);
            box-shadow: 0 12px 25px rgba(67, 233, 123, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .books-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 35px;
            width: 100%;
            max-width: 1250px;
            z-index: 10;
        }

        /* KITOB KARTALARI */
        .book-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 220px;
            box-shadow: 0 10px 30px var(--glass-shadow);
            position: relative;
        }

        .book-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: var(--glass-hover-border);
            box-shadow: 0 15px 40px var(--glass-hover-shadow), inset 0 0 20px var(--glass-hover-shadow);
        }

        .book-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            word-break: break-word;
            line-height: 1.3;
        }

        .book-author {
            font-size: 1rem;
            color: var(--text-sub);
            margin-bottom: 15px;
            font-style: italic;
        }

        .download-count {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 500;
        }

        .card-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
        }

        .download-btn {
            background: var(--btn-action);
            color: #fff;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .download-btn:hover {
            transform: scale(1.08) translateY(-2px);
            background: var(--btn-hover-action);
            box-shadow: 0 10px 20px rgba(67, 233, 123, 0.3);
        }

        .edit-btn, .delete-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            padding: 10px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            cursor: pointer;
            margin-left: 8px;
            backdrop-filter: blur(10px);
        }

        .edit-btn:hover {
            background: rgba(72, 198, 239, 0.5);
            transform: scale(1.15);
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 0.6);
            border-color: rgba(255, 59, 48, 0.8);
            transform: scale(1.15);
        }

        /* MODAL OYNA */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            padding: 35px;
            border-radius: 24px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        
        .modal.active .modal-box {
            transform: scale(1);
        }
        
        .modal-box .btn-glass {
            width: 100%;
            margin-top: 10px;
            padding: 14px;
        }

        /* FOOTER (Ziyorat va Dasturchi) */
        .footer-info {
            margin-top: auto; /* Avtomatik ravishda sahifaning eng pastiga itaradi */
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .visits-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            font-size: 0.95rem;
            font-weight: 500;
        }

        .developer-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
        }

        .developer-link:hover {
            background: rgba(36, 161, 222, 0.1); /* Telegram color soft bg */
            border-color: #24A1DE;
            color: #24A1DE;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 25px rgba(36, 161, 222, 0.2);
        }

        body.light-mode .developer-link:hover {
            background: rgba(0, 136, 204, 0.1);
            border-color: #0088cc;
            color: #0088cc;
        }

        /* Ikonkalar (SVG) */
        .svg-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .svg-icon-stroke {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

    </style>

    <!-- Firebase SDK (v8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

        <button class="btn-glass" onclick="toggleTheme()"><span id="themeIcon">🌙</span> <span id="themeText">Tun</span></button>

    <h1>📚 Kitoblar Portali</h1>

    <div class="admin-panel" id="adminPanel">
        <h3>➕ Yangi Kitob Qo'shish (Admin)</h3>
        <div class="form-group">

            <div class="file-input-group">

    <div class="books-grid" id="booksGrid"></div>

    <!-- FOOTER QISMI (Yangi qo'shildi) -->

            Total visits: <span id="visitCount">...</span>

    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3 style="margin-bottom: 20px; font-weight: 600;">Admin Tizimiga Kirish</h3>
            <div class="form-group">
                <input type="text" id="adminUsername" placeholder="Login">
                <input type="password" id="adminPassword" placeholder="Parol">
                <button class="btn-submit" onclick="checkAdmin()">Kirish</button>
                <button class="btn-glass" onclick="closeLoginModal()">Yopish</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiv1_SHvvNrAg_hU60qI19IAtrKjIAaKY",
            authDomain: "adwawdaw-eef09.firebaseapp.com",
            databaseURL: "https://adwawdaw-eef09-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "adwawdaw-eef09",
            storageBucket: "adwawdaw-eef09.firebasestorage.app",
            messagingSenderId: "446197877477",
            appId: "1:446197877477:web:ef032e3eaa80f5425fa20c"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let isAdmin = false;
        let globalBooks = [];

        // GitHub Integratsiyasi sozlamalari 
        const GITHUB_USERNAME = "firdavs-2810";
        const GITHUB_REPO = "source";

        // TASHRIFLARNI HISOBLASH FUNKSIYASI (Yangi qo'shildi)
        function incrementAndGetVisits() {
            const visitsRef = db.ref('stats/totalVisits');
            
            // Transaction yordamida ma'lumotlarni xavfsiz yangilash (bir vaqtda bir nechta odam kirganda ham to'g'ri sanaydi)
            visitsRef.transaction((currentVisits) => {
                return (currentVisits || 0) + 1;
            }, (error, committed, snapshot) => {
                if (error) {
                    console.error("Tashriflarni hisoblashda xatolik:", error);
                    document.getElementById('visitCount').innerText = "Xato";
                } else if (committed) {
                    document.getElementById('visitCount').innerText = snapshot.val();
                }
            });
        }
        
        // Sahifa yuklanganda tashrifni yozish
        window.addEventListener('DOMContentLoaded', incrementAndGetVisits);

        async function uploadToGitHub(fileInput) {
            const file = fileInput.files[0];
            if (!file) return;

            const statusDiv = document.getElementById('uploadStatus');
            const linkInput = document.getElementById('bookLinkInput');
            const submitBtn = document.getElementById('uploadBtn');

            statusDiv.innerHTML = "⏳ GitHub token olinmoqda va fayl yuklanmoqda...";
            statusDiv.style.color = "var(--glass-hover-border)";
            submitBtn.disabled = true;

            try {
                const tokenSnapshot = await db.ref('token').once('value');
                const dynamicGitHubToken = tokenSnapshot.val();

                if (!dynamicGitHubToken) {
                    throw new Error("GitHub token bazadan topilmadi!");
                }

                const reader = new FileReader();
                reader.readAsDataURL(file);
                
                reader.onload = async function () {
                    try {
                        const base64Content = reader.result.split(',')[1];
                        const fileName = Date.now() + "_" + file.name.replace(/\s+/g, "_");
                        const path = `files/${fileName}`;

                        const url = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${path}`;

                        const response = await fetch(url, {
                            method: "PUT",
                            headers: {
                                "Authorization": `token ${dynamicGitHubToken}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                message: `Upload file: ${fileName}`,
                                content: base64Content
                            })
                        });

                        if (response.ok) {
                            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${path}`;
                            linkInput.value = rawUrl;
                            statusDiv.innerHTML = "✅ Fayl muvaffaqiyatli yuklandi!";
                            statusDiv.style.color = "#4caf50";
                        } else {
                            const errorData = await response.json();
                            statusDiv.innerHTML = "❌ Yuklashda xatolik: " + (errorData.message || "Noma'lum xato");
                            statusDiv.style.color = "#ff4757";
                        }
                    } catch (err) {
                        statusDiv.innerHTML = "❌ Xatolik: " + err.message;
                        statusDiv.style.color = "#ff4757";
                    } finally {
                        submitBtn.disabled = false;
                        fileInput.value = "";
                    }
                };

                reader.onerror = function () {
                    statusDiv.innerHTML = "❌ Faylni o'qishda xatolik yuz berdi.";
                    statusDiv.style.color = "#ff4757";
                    submitBtn.disabled = false;
                };

            } catch (error) {
                statusDiv.innerHTML = "❌ Xatolik: " + error.message;
                statusDiv.style.color = "#ff4757";
                submitBtn.disabled = false;
                fileInput.value = "";
            }
        }

        db.ref("books").on("value", (snapshot) => {
            globalBooks = [];
            if (snapshot.exists()) {
                snapshot.forEach((childSnapshot) => {
                    globalBooks.push({
                        id: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });
                globalBooks.reverse();
            }
            renderBooks(globalBooks);
        });

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            document.getElementById('themeIcon').innerText = isLight ? '☀️' : '🌙';
            document.getElementById('themeText').innerText = isLight ? 'Kun' : 'Tun';
        }

        function openLoginModal() {
            if (isAdmin) {
                isAdmin = false;
                document.getElementById('adminPanel').classList.remove('active');
                document.getElementById('adminAuthBtn').innerText = '🔑 Admin Kirish';
                renderBooks(globalBooks);
            } else {
                document.getElementById('loginModal').classList.add('active');
            }
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.remove('active');
        }

        function checkAdmin() {
            const user = document.getElementById('adminUsername').value;
            const pass = document.getElementById('adminPassword').value;
            
            const user1 = "YW5hbmFz";
            const pass1 = "MjAxMQ==";

            if (user === atob(user1) && pass === atob(pass1)) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('adminAuthBtn').innerText = '🚪 Chiqish';
                closeLoginModal();
                document.getElementById('adminUsername').value = '';
                document.getElementById('adminPassword').value = '';
                renderBooks(globalBooks);
            } else {
                alert('Login yoki parol noto\'g\'ri!');
            }
        }

        function renderBooks(books) {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = '';

            books.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                
                let adminControls = '';
                if (isAdmin) {
                    adminControls = `
                        <div>
                            <button class="edit-btn" onclick="editBookTitle('${book.id}', '${escapeHtml(book.title)}')">✏️</button>
                            <button class="delete-btn" onclick="deleteBook('${book.id}')">🗑️</button>
                        </div>
                    `;
                }

                const downloads = book.downloads || 0;

                card.innerHTML = `
                    <div>
                        <div class="book-title">${escapeHtml(book.title)}</div>
                        <div class="book-author">${escapeHtml(book.author)}</div>
                        <div class="download-count">📥 <span>${downloads}</span> marta yuklangan</div>
                    </div>
                    <div class="card-bottom">
                        <a href="${escapeHtml(book.linkUrl)}" target="_blank" rel="noopener noreferrer" class="download-btn" onclick="registerDownload('${book.id}')">📥 Tortib olish</a>
                        ${adminControls}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Yuklab olish tugmasi bosilganda sonini oshirish
        function registerDownload(id) {
             db.ref(`books/${id}/downloads`).transaction((currentDownloads) => {
                 return (currentDownloads || 0) + 1;
             });
        }

        async function addNewBook() {
            const title = document.getElementById('bookTitleInput').value.trim();
            const author = document.getElementById('bookAuthorInput').value.trim();
            const linkUrl = document.getElementById('bookLinkInput').value.trim();
            const uploadBtn = document.getElementById('uploadBtn');

            if (!title || !author || !linkUrl) {
                alert('Barcha maydonlarni va kitob silkasini to\'ldiring!');
                return;
            }

            try {
                uploadBtn.innerText = 'Saqlanmoqda...';
                uploadBtn.disabled = true;

                await db.ref("books").push({
                    title: title,
                    author: author,
                    linkUrl: linkUrl,
                    downloads: 0,
                    createdAt: Date.now()
                });

                alert('Kitob muvaffaqiyatli qo\'shildi!');

                document.getElementById('bookTitleInput').value = '';
                document.getElementById('bookAuthorInput').value = '';
                document.getElementById('bookLinkInput').value = '';
                document.getElementById('uploadStatus').innerHTML = '';
            } catch (error) {
                console.error(error);
                alert('Qo\'shishda xatolik yuz berdi: ' + error.message);
            } finally {
                uploadBtn.innerText = 'Kitobni Qo\'shish';
                uploadBtn.disabled = false;
            }
        }

        async function editBookTitle(id, oldTitle) {
            const newTitle = prompt('Yangi kitob nomini kiriting:', oldTitle);
            if (newTitle && newTitle.trim() !== '') {
                await db.ref(`books/${id}`).update({
                    title: newTitle.trim()
                });
            }
        }

        async function deleteBook(id) {
            if (confirm('Rostdan ham ushbu kitobni o\'chirmoqchimisiz?')) {
                try {
                    await db.ref(`books/${id}`).remove();
                } catch (error) {
                    console.error(error);
                }
            }
        }

        function escapeHtml(str) {
            return String(str || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
